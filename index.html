<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストループテスト（統計・ランキング機能付き）</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #333333;
      --danger: #e74c3c;
      --success: #2ecc71;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      width: 90%;
      max-width: 520px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      line-height: 1.5;
      color: #555;
      font-size: 0.95rem;
    }
    .input-group {
      margin: 1rem 0;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
      font-size: 0.9rem;
    }
    input[type="text"] {
      padding: 0.7rem;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
      margin-top: 1rem;
      font-weight: bold;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .timer-bar-container {
      width: 100%;
      height: 10px;
      background-color: #eee;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }
    .timer-bar {
      height: 100%;
      background-color: var(--primary);
      width: 100%;
      transition: width 0.05s linear;
    }
    .rule-badge {
      display: inline-block;
      background: #eef5ff;
      color: var(--primary);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .stimulus-area {
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
      position: relative;
      background: #fafafa;
      border-radius: 12px;
      border: 1px solid #eee;
      overflow: hidden;
    }
    .stimulus-icon {
      font-size: 6.5rem;
      user-select: none;
    }
    .stimulus-img {
      max-height: 150px;
      max-width: 100%;
      object-fit: contain;
    }
    .stroop-word {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 900;
      color: #111111;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 0.2rem 0.8rem;
      border-radius: 6px;
      border: 2px solid #222;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .choice-btn {
      background: #f8f9fa;
      border: 2px solid #dee2e6;
      padding: 1rem 0.5rem;
      font-size: 1rem;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);
      font-weight: bold;
      transition: background 0.15s;
    }
    .choice-btn:hover {
      background: #e9ecef;
    }
    .choice-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .feedback-overlay {
      position: absolute;
      font-size: 5rem;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 10;
    }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .result-table th, .result-table td {
      border: 1px solid #ddd;
      padding: 0.6rem 0.3rem;
      text-align: center;
    }
    .result-table th {
      background-color: #f2f4f8;
    }
    .info-box {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 1rem;
      background: #f8f9fa;
      padding: 0.8rem;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. タイトル画面 -->
  <div id="screen-start" class="screen active">
    <h1>ストループテスト（絵と単語の干渉）</h1>
    <p>イラストの上に「邪魔な文字」が重なって表示されます。<br>文字に惑わされず、背景のイラストについて4択から素早く答えてください。</p>
    
    <div class="input-group">
      <label for="player-name">プレイヤー名（ニックネーム）</label>
      <input type="text" id="player-name" placeholder="例: たろう（空欄の場合は匿名）">
    </div>

    <div class="input-group">
      <label for="seed-input">合言葉（友達と同じ問題にする場合）</label>
      <input type="text" id="seed-input" placeholder="例: 1234（空欄でランダム）">
    </div>

    <button class="btn" onclick="initGame()">ゲームスタート</button>
  </div>

  <!-- 2. レベル案内画面 -->
  <div id="screen-intro" class="screen">
    <h2 id="intro-title">Lv1</h2>
    <p id="intro-desc">説明</p>
    <p style="font-size: 0.85rem; color: #666;">※上に書かれた文字は無視してください！</p>
    <p id="intro-time" style="font-weight:bold; color: var(--danger);"></p>
    <button class="btn" onclick="startLevel()">スタート</button>
  </div>

  <!-- 3. ゲームプレイ画面 -->
  <div id="screen-play" class="screen">
    <div class="status-bar">
      <span id="play-level">Lv1</span>
      <span id="play-progress">1 / 10</span>
    </div>
    <div class="timer-bar-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>
    <div id="play-rule" class="rule-badge">ルール</div>
    <div class="stimulus-area">
      <div id="stimulus-content"></div>
      <div id="stroop-word" class="stroop-word"></div>
      <div id="feedback" class="feedback-overlay"></div>
    </div>
    <div id="choices" class="choices-grid"></div>
  </div>

  <!-- 4. リザルト画面 -->
  <div id="screen-result" class="screen">
    <h1>結果発表</h1>
    <div id="result-meta" class="info-box"></div>
    
    <h2>あなたの記録</h2>
    <table class="result-table">
      <thead>
        <tr>
          <th>レベル</th>
          <th>正解数</th>
          <th>平均反応時間</th>
          <th>文字につられた回数</th>
        </tr>
      </thead>
      <tbody id="result-tbody"></tbody>
    </table>

    <h2>クラス全体の統計・ランキング</h2>
    <div id="online-status" style="font-size:0.9rem; color:#666; margin: 1rem 0;">データを送信・集計中...</div>
    
    <div id="global-stats-area" style="display:none;">
      <div id="global-stats-box" class="info-box"></div>
      <table class="result-table">
        <thead>
          <tr>
            <th>順位</th>
            <th>名前</th>
            <th>合計正解</th>
            <th>平均時間</th>
            <th>合言葉</th>
          </tr>
        </thead>
        <tbody id="ranking-tbody"></tbody>
      </table>
    </div>

    <button class="btn" onclick="resetGame()">タイトルへ戻る</button>
  </div>
</div>

<script>
  // ★ここにGASの「ウェブアプリのURL」を貼り付けてください★
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzH0PKaNkT91EBtvOpBeYo-M4rYh-qdX8CW-h9tJryxEOkjSNLIdUeatIrRHNW1wZr2/exec";

  // 問題データベース
  const ITEM_POOL = [
    { id: 1, icon: "📮", image: "", color: "赤", name: "ポスト", action: "手紙を入れる" },
    { id: 2, icon: "🍊", image: "", color: "オレンジ", name: "みかん", action: "皮をむいて食べる" },
    { id: 3, icon: "🍌", image: "", color: "黄色", name: "バナナ", action: "房からちぎる" },
    { id: 4, icon: "🌲", image: "", color: "緑", name: "木", action: "光合成をする" },
    { id: 5, icon: "🚙", image: "", color: "青", name: "車", action: "運転して移動する" },
    { id: 6, icon: "🍆", image: "", color: "紫", name: "なす", action: "料理して食べる" },
    { id: 7, icon: "⛄", image: "", color: "白", name: "雪だるま", action: "雪を丸めて作る" },
    { id: 8, icon: "🐈‍⬛", image: "", color: "黒", name: "黒猫", action: "なでて可愛がる" },
    { id: 9, icon: "🐷", image: "", color: "ピンク", name: "ブタ", action: "鳴き声をあげる" },
    { id: 10, icon: "📦", image: "", color: "茶色", name: "段ボール", action: "荷物を詰める" },
    { id: 11, icon: "🐘", image: "", color: "灰色", name: "ゾウ", action: "長い鼻を使う" },
    { id: 12, icon: "👑", image: "", color: "金", name: "王冠", action: "頭にかぶる" },
    { id: 13, icon: "🥄", image: "", color: "銀", name: "スプーン", action: "すくって食べる" },
    { id: 14, icon: "🌊", image: "", color: "水色", name: "波", action: "海岸に打ち寄せる" },
    { id: 15, icon: "🥬", image: "", color: "黄緑", name: "キャベツ", action: "千切りにする" }
  ];

  const LEVELS = [
    { level: 1, key: "color", title: "Lv1：色水準", desc: "文字は無視して、イラストの「色」を答えてください。", timeLimit: 3000 },
    { level: 2, key: "name", title: "Lv2：文字水準", desc: "文字は無視して、イラストの「名前」を答えてください。", timeLimit: 2000 },
    { level: 3, key: "action", title: "Lv3：意味水準", desc: "文字は無視して、イラストの「用途・行動」を答えてください。", timeLimit: 1000 }
  ];

  const QUESTIONS_PER_LEVEL = 10;

  let rng = Math.random;
  let playerName = "";
  let currentSeedStr = "";
  let currentLevelIdx = 0;
  let currentQuestionIdx = 0;
  let levelQuestions = [];
  let timerInterval = null;
  let questionStartTime = 0;
  let isAnswering = false;
  let stats = [];

  function createSeededRandom(seedStr) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seedStr.length; i++) {
      h = Math.imul(h ^ seedStr.charCodeAt(i), 16777619);
    }
    let a = h >>> 0;
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(array) {
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    return arr;
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function initGame() {
    const nameVal = document.getElementById('player-name').value.trim();
    playerName = nameVal === "" ? "匿名" : nameVal;

    const inputVal = document.getElementById('seed-input').value.trim();
    if (inputVal === "") {
      currentSeedStr = Math.floor(1000 + Math.random() * 9000).toString();
    } else {
      currentSeedStr = inputVal;
    }
    rng = createSeededRandom(currentSeedStr);
    currentLevelIdx = 0;
    stats = LEVELS.map(() => ({ correct: 0, times: [], stroopErrors: 0 }));
    prepareLevelIntro();
  }

  function prepareLevelIntro() {
    const lv = LEVELS[currentLevelIdx];
    document.getElementById('intro-title').textContent = lv.title;
    document.getElementById('intro-desc').textContent = lv.desc;
    document.getElementById('intro-time').textContent = "1問あたりの制限時間：" + (lv.timeLimit / 1000) + "秒";
    showScreen('screen-intro');
  }

  function startLevel() {
    const lv = LEVELS[currentLevelIdx];
    const shuffledPool = shuffle(ITEM_POOL);
    levelQuestions = [];

    for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
      const target = shuffledPool[i % shuffledPool.length];
      const correctAns = target[lv.key];

      const otherAnswers = ITEM_POOL
        .filter(item => item[lv.key] !== correctAns)
        .map(item => item[lv.key]);
      
      const uniqueOthers = Array.from(new Set(otherAnswers));
      const shuffledOthers = shuffle(uniqueOthers);

      const incongruentWord = shuffledOthers[0];
      const otherDistractors = shuffledOthers.slice(1, 3);
      const choices = shuffle([correctAns, incongruentWord, ...otherDistractors]);

      levelQuestions.push({
        target: target,
        correctAns: correctAns,
        incongruentWord: incongruentWord,
        choices: choices
      });
    }

    currentQuestionIdx = 0;
    showScreen('screen-play');
    nextQuestion();
  }

  function nextQuestion() {
    if (currentQuestionIdx >= QUESTIONS_PER_LEVEL) {
      finishLevel();
      return;
    }

    const lv = LEVELS[currentLevelIdx];
    const q = levelQuestions[currentQuestionIdx];

    document.getElementById('play-level').textContent = lv.title;
    document.getElementById('play-progress').textContent = (currentQuestionIdx + 1) + " / " + QUESTIONS_PER_LEVEL;
    document.getElementById('play-rule').textContent = lv.desc;

    const stimContainer = document.getElementById('stimulus-content');
    stimContainer.innerHTML = "";
    if (q.target.image && q.target.image !== "") {
      const img = document.createElement('img');
      img.src = q.target.image;
      img.className = 'stimulus-img';
      stimContainer.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.className = 'stimulus-icon';
      span.textContent = q.target.icon;
      stimContainer.appendChild(span);
    }

    const wordEl = document.getElementById('stroop-word');
    wordEl.textContent = q.incongruentWord;
    wordEl.style.fontSize = lv.key === "action" ? "1.3rem" : "2rem";

    const choicesContainer = document.getElementById('choices');
    choicesContainer.innerHTML = "";
    q.choices.forEach(choiceText => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choiceText;
      btn.onclick = () => handleAnswer(choiceText);
      choicesContainer.appendChild(btn);
    });

    isAnswering = true;
    questionStartTime = performance.now();
    startTimer(lv.timeLimit);
  }

  function startTimer(duration) {
    clearInterval(timerInterval);
    const bar = document.getElementById('timer-bar');
    bar.style.width = '100%';
    bar.style.backgroundColor = 'var(--primary)';

    timerInterval = setInterval(() => {
      const elapsed = performance.now() - questionStartTime;
      const remaining = Math.max(0, duration - elapsed);
      const percent = (remaining / duration) * 100;
      bar.style.width = percent + '%';

      if (percent < 30) {
        bar.style.backgroundColor = 'var(--danger)';
      }

      if (remaining <= 0) {
        clearInterval(timerInterval);
        if (isAnswering) {
          handleAnswer(null);
        }
      }
    }, 20);
  }

  function handleAnswer(selectedText) {
    if (!isAnswering) return;
    isAnswering = false;
    clearInterval(timerInterval);

    const reactionTime = performance.now() - questionStartTime;
    const q = levelQuestions[currentQuestionIdx];
    const isCorrect = (selectedText === q.correctAns);

    if (isCorrect) {
      stats[currentLevelIdx].correct++;
      stats[currentLevelIdx].times.push(reactionTime);
    } else if (selectedText === q.incongruentWord) {
      // 邪魔な文字（ストループ干渉）を選んでしまった場合をカウント
      stats[currentLevelIdx].stroopErrors++;
    }

    const fb = document.getElementById('feedback');
    if (selectedText === null) {
      fb.textContent = "時間切れ";
      fb.style.fontSize = "2.5rem";
      fb.style.color = "var(--danger)";
    } else if (isCorrect) {
      fb.textContent = "⭕";
      fb.style.fontSize = "5rem";
      fb.style.color = "var(--success)";
    } else {
      fb.textContent = "❌";
      fb.style.fontSize = "5rem";
      fb.style.color = "var(--danger)";
    }
    fb.style.opacity = "1";

    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

    setTimeout(() => {
      fb.style.opacity = "0";
      currentQuestionIdx++;
      nextQuestion();
    }, 500);
  }

  function finishLevel() {
    currentLevelIdx++;
    if (currentLevelIdx < LEVELS.length) {
      prepareLevelIntro();
    } else {
      showResults();
    }
  }

  function calcAvgSec(timesArray) {
    if (timesArray.length === 0) return 0;
    const sum = timesArray.reduce((a, b) => a + b, 0);
    return Number(((sum / timesArray.length) / 1000).toFixed(2));
  }

  function showResults() {
    showScreen('screen-result');
    document.getElementById('result-meta').innerHTML = 
      `プレイヤー名: ${playerName}<br>使用した合言葉: ${currentSeedStr}`;

    const tbody = document.getElementById('result-tbody');
    tbody.innerHTML = "";

    let totalCorrect = 0;
    let allTimes = [];
    let totalStroopErrors = 0;

    LEVELS.forEach((lv, idx) => {
      const st = stats[idx];
      totalCorrect += st.correct;
      allTimes = allTimes.concat(st.times);
      totalStroopErrors += st.stroopErrors;

      const avgSec = calcAvgSec(st.times);
      const avgTimeStr = avgSec > 0 ? avgSec + " 秒" : "-";

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${lv.title}</td>
        <td>${st.correct} / ${QUESTIONS_PER_LEVEL}</td>
        <td>${avgTimeStr}</td>
        <td>${st.stroopErrors} 回</td>
      `;
      tbody.appendChild(tr);
    });

    const payload = {
      name: playerName,
      seed: currentSeedStr,
      totalCorrect: totalCorrect,
      totalAvgTime: calcAvgSec(allTimes),
      totalStroopErrors: totalStroopErrors,
      lv1Correct: stats[0].correct,
      lv1Time: calcAvgSec(stats[0].times),
      lv2Correct: stats[1].correct,
      lv2Time: calcAvgSec(stats[1].times),
      lv3Correct: stats[2].correct,
      lv3Time: calcAvgSec(stats[2].times)
    };

    sendAndFetchData(payload);
  }

  async function sendAndFetchData(payload) {
    const statusEl = document.getElementById('online-status');
    const areaEl = document.getElementById('global-stats-area');
    
    if (!GAS_URL || GAS_URL.includes("ここに")) {
      statusEl.textContent = "※GASのURLが未設定のため、オンライン集計は表示されません。";
      return;
    }

    statusEl.style.display = "block";
    statusEl.textContent = "結果をサーバーに送信し、ランキングを取得しています...";
    areaEl.style.display = "none";

    try {
      // データの送信
      await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });

      // ランキングと統計の取得
      const res = await fetch(GAS_URL);
      const data = await res.json();

      statusEl.style.display = "none";
      areaEl.style.display = "block";

      if (data.stats) {
        document.getElementById('global-stats-box').innerHTML = `
          総プレイ回数：${data.stats.totalPlays} 回<br>
          全体の平均反応時間：Lv1（${data.stats.avgLv1Time}秒） / Lv2（${data.stats.avgLv2Time}秒） / Lv3（${data.stats.avgLv3Time}秒）<br>
          文字につられた平均回数：1プレイあたり ${data.stats.avgStroopErrors} 回
        `;
      }

      const rTbody = document.getElementById('ranking-tbody');
      rTbody.innerHTML = "";
      data.ranking.forEach((row, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}位</td>
          <td>${row.name}</td>
          <td>${row.totalCorrect} / 30</td>
          <td>${row.totalAvgTime < 900 ? row.totalAvgTime + "秒" : "-"}</td>
          <td>${row.seed}</td>
        `;
        rTbody.appendChild(tr);
      });

    } catch (err) {
      statusEl.textContent = "通信エラーが発生しました。URLやGASの公開設定（アクセスできるユーザー：全員）を確認してください。";
    }
  }

  function resetGame() {
    showScreen('screen-start');
  }
</script>
</body>
</html>
